mayer_factor: 5

w_path_tracking: 10
w_path_progression: 20

W_diag_v_body: [0, 10]
w_turn_rate : 0.5

w_slack_contour: 1.5e2 #5e1 laopt

# Bounds
lat_acc_max: 0.10
car_width: 0.22

throttle_min: 0.15
throttle_max: 0.6

