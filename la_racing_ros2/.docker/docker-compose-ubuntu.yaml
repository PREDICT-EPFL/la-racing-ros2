version: '3'
services:
  la_racing:
    image: la_racing:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: la_racing
    volumes:
      - .:/la_racing_ws
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - /dev:/dev:rw
    environment:
      - DISPLAY=$DISPLAY
      - QT_X11_NO_MITSHM=1
      - XAUTHORITY=/tmp/.docker.xauth
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
    security_opt:
      - seccomp:unconfined
    privileged: true
    tty: true
    network_mode: "host"
